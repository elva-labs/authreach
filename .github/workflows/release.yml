name: Release

# Tag a version to publish a signed, notarized release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires five repository secrets (see RELEASING.md):
#   MACOS_CERTIFICATE        base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD   password protecting the .p12
#   NOTARY_KEY      contents of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID      the key's Key ID
#   NOTARY_ISSUER_ID   the key's Issuer ID

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate into a throwaway keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "No Developer ID Application identity found"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" scripts/make-app.sh

      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          # Accept the key stored either as raw PEM or base64-encoded PEM.
          if printf '%s' "$NOTARY_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$NOTARY_KEY" > "$KEY_FILE"
          else
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$KEY_FILE" 2>/dev/null || true
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY_FILE" \
            || { echo "NOTARY_KEY secret is neither a PEM key nor base64-encoded PEM"; exit 1; }

          ditto -c -k --keepParent "build/AuthReach.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_FILE" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "build/AuthReach.app"
          rm "$KEY_FILE"

      - name: Verify Gatekeeper acceptance
        run: spctl --assess --type execute -v "build/AuthReach.app"

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="authreach-$VERSION.zip"
          ditto -c -k --keepParent "build/AuthReach.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "AuthReach $VERSION" --generate-notes
