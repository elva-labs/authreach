name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Releases are universal (Apple silicon + Intel), so the tests run
    # natively on both. macos-15-intel is GitHub's last x86_64 image and is
    # available until August 2027.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # Cross-compiles the x86_64 slice, so one runner covers both; ARM64 is
      # the runner that stays when the Intel image is retired.
      - name: Assemble universal app bundle
        if: runner.arch == 'ARM64'
        env:
          AUTHREACH_ARCHS: arm64 x86_64
        run: scripts/make-app.sh
